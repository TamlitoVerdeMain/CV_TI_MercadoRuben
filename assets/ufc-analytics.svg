<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Octagono de artes marciales mixtas sobre un panel de graficas de datos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121218"/>
      <stop offset="0.55" stop-color="#0c0c10"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <linearGradient id="goldFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3d2a4"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="octaClip">
      <polygon points="300,56 404,99 447,203 404,307 300,350 196,307 153,203 196,99"/>
    </clipPath>
  </defs>

  <rect width="600" height="340" fill="url(#bg)"/>
  <rect width="600" height="340" fill="url(#spot)"/>

  <!-- Retícula de datos -->
  <g stroke="#d4af37" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 68h600M0 136h600M0 204h600M0 272h600"/>
    <path d="M75 0v340M150 0v340M225 0v340M300 0v340M375 0v340M450 0v340M525 0v340"/>
  </g>

  <!-- Barras de analitica al fondo -->
  <g fill="#d4af37" fill-opacity="0.16">
    <rect x="42" y="236" width="26" height="78" rx="2"/>
    <rect x="86" y="198" width="26" height="116" rx="2"/>
    <rect x="130" y="256" width="26" height="58" rx="2"/>
    <rect x="444" y="214" width="26" height="100" rx="2"/>
    <rect x="488" y="172" width="26" height="142" rx="2"/>
    <rect x="532" y="246" width="26" height="68" rx="2"/>
  </g>

  <!-- Linea de tendencia -->
  <polyline points="36,170 100,142 164,158 228,108 300,124 372,84 436,106 500,62 564,80"
            fill="none" stroke="#d4af37" stroke-opacity="0.45" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#e3d2a4">
    <circle cx="228" cy="108" r="3.5"/>
    <circle cx="372" cy="84" r="3.5"/>
    <circle cx="500" cy="62" r="4.5"/>
  </g>

  <!-- Octagono (jaula) -->
  <g>
    <polygon points="300,56 404,99 447,203 404,307 300,350 196,307 153,203 196,99"
             fill="#0a0a0c" fill-opacity="0.72" stroke="url(#goldFade)" stroke-width="3"/>
    <g clip-path="url(#octaClip)" stroke="#d4af37" stroke-opacity="0.22" stroke-width="1">
      <path d="M170 20l280 280M450 20L170 300M230 10v340M300 10v340M370 10v340M140 110h320M140 180h320M140 250h320"/>
    </g>
    <polygon points="300,80 387,116 423,203 387,290 300,326 213,290 177,203 213,116"
             fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>

  <!-- Vertices del octagono -->
  <g fill="#d4af37">
    <circle cx="300" cy="56" r="4"/><circle cx="404" cy="99" r="4"/>
    <circle cx="447" cy="203" r="4"/><circle cx="404" cy="307" r="4"/>
    <circle cx="300" cy="350" r="4"/><circle cx="196" cy="307" r="4"/>
    <circle cx="153" cy="203" r="4"/><circle cx="196" cy="99" r="4"/>
  </g>

  <!-- Etiqueta -->
  <text x="300" y="196" text-anchor="middle" font-family="Jost, Segoe UI, sans-serif"
        font-size="44" font-weight="500" letter-spacing="10" fill="#ece8e1">UFC</text>
  <text x="300" y="228" text-anchor="middle" font-family="Jost, Segoe UI, sans-serif"
        font-size="16" font-weight="300" letter-spacing="7" fill="#d4af37">ANALYTICS</text>
</svg>
